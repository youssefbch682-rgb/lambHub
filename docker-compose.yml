services:
  backend:
    build:
      context: ./server
    container_name: lamberet-hub-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_PATH: /app/data/lamberet-hub.db
      # ⚠️ Modifie ces 3 valeurs avant de lancer "docker compose up" :
      JWT_SECRET: "lamberet2026-secret-xk29fj28fjs-change-moi"
      ADMIN_EMAIL: "admin@lamberet.fr"
      ADMIN_PASSWORD: "admin"
    volumes:
      - /docker/lamberet_hub_data:/app/data   # la base SQLite survit aux redéploiements
    networks:
      - lamberet-hub

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lamberet-hub-frontend
    restart: unless-stopped
    ports:
      - "355:80"   # accès : http://<serveur-lamberet>:8080
    depends_on:
      - backend
    networks:
      - lamberet-hub

networks:
  lamberet-hub:
    ipam:
      config:
        - subnet: 172.33.0.0/16

volumes:
  lamberet_hub_data:   # ← c'est CE volume qu'il faut sauvegarder (voir README)
